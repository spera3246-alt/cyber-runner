<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>사이버 러너</title>
<style>
  :root {
    --bg: #040814;
    --panel: rgba(8, 16, 36, 0.82);
    --cyan: #5ce1ff;
    --cyan-dim: rgba(92, 225, 255, 0.16);
    --pink: #ff4d7a;
    --text: #e8f4ff;
    --muted: #8aa0c2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: #06101f;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #view {
    flex: 1;
    min-height: 0;
    position: relative;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 16px 16px 0;
    pointer-events: none;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }
  #hearts {
    font-size: 22px;
    letter-spacing: 2px;
    line-height: 1;
  }
  #hearts .on { color: var(--pink); }
  #hearts .off { color: rgba(255, 255, 255, 0.22); }
  #stats {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #score {
    font-size: 28px;
    font-weight: 800;
    color: white;
  }
  #dist {
    display: block;
    margin-top: 2px;
    color: var(--cyan);
    font-size: 14px;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 28px 22px 18px;
    background: linear-gradient(180deg, rgba(4, 10, 22, 0.78) 0%, rgba(4, 10, 22, 0.96) 30%, #06101c 58%);
  }
  .overlay[hidden] { display: none; }
  .kicker {
    margin: 0 0 6px;
    color: var(--cyan);
    letter-spacing: 0.22em;
    font-size: 12px;
    font-weight: 700;
  }
  h1, h2 {
    margin: 0 0 8px;
    font-size: 34px;
    letter-spacing: -0.03em;
  }
  .lead, .sub {
    margin: 0 0 16px;
    color: var(--muted);
    line-height: 1.5;
    font-size: 14px;
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .card {
    appearance: none;
    border: 1px solid rgba(92, 225, 255, 0.25);
    background: rgba(10, 22, 48, 0.72);
    color: inherit;
    border-radius: 16px;
    padding: 12px 10px 14px;
    cursor: pointer;
  }
  .card img {
    width: 100%;
    height: 120px;
    object-fit: contain;
    filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.35));
  }
  .card strong { display: block; font-size: 18px; }
  .card span { color: var(--muted); font-size: 12px; }
  .card.selected {
    border-color: var(--cyan);
    box-shadow: 0 0 0 1px var(--cyan), 0 0 28px rgba(92, 225, 255, 0.28);
    background: rgba(16, 40, 72, 0.85);
  }
  .help {
    margin: 0 0 16px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(6, 18, 36, 0.92);
    color: #d5ecff;
    font-size: 13px;
    line-height: 1.55;
  }
  button.primary, button.ghost {
    appearance: none;
    border: 0;
    border-radius: 12px;
    padding: 14px 16px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button.primary {
    background: linear-gradient(180deg, #7af0ff, #2bb8e6);
    color: #042033;
  }
  button.ghost {
    margin-top: 8px;
    background: transparent;
    color: var(--cyan);
    border: 1px solid rgba(92, 225, 255, 0.4);
  }
  .results {
    display: grid;
    gap: 8px;
    margin: 8px 0 18px;
    width: 100%;
  }
  .results p {
    position: relative;
    margin: 0;
    padding: 12px 88px 12px 14px;
    border-radius: 10px;
    background: #0d1c33;
  }
  .results span { color: var(--muted); }
  .results b {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #pad {
    display: grid;
    grid-template-columns: 1fr 1.15fr 1fr;
    gap: 8px;
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
    background: #07101e;
  }
  #pad button {
    appearance: none;
    height: 58px;
    border-radius: 14px;
    border: 1px solid rgba(92, 225, 255, 0.28);
    background: #10203a;
    color: white;
    font: inherit;
    font-weight: 800;
    font-size: 16px;
  }
  #pad button:active { background: #1a3d66; }
  #pad button:disabled { opacity: 0.35; }
  .best-line {
    margin: -6px 0 14px;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="view">
      <canvas id="c"></canvas>
      <div id="hud" hidden>
        <div id="hearts"></div>
        <div id="stats">
          <div id="score">0</div>
          <span id="dist">0 m</span>
        </div>
      </div>
      <section id="menu" class="overlay">
        <p class="kicker">CYBER RUNNER</p>
        <h1>사이버 러너</h1>
        <p class="lead">코딩 세상을 달리며 바이러스를 피하세요.</p>
        <div class="cards">
          <button type="button" class="card selected" data-id="ttor">
            <img src="assets/ttor/idle-front.png" alt="또르" />
            <strong>또르</strong>
            <span>든든한 AI 백곰</span>
          </button>
          <button type="button" class="card" data-id="ppiya">
            <img src="assets/ppiya/idle-front.png" alt="삐야" />
            <strong>삐야</strong>
            <span>재빠른 AI 병아리</span>
          </button>
        </div>
        <p class="best-line" id="menuBest">최고 점수 0</p>
        <div class="help">
          ← → 또는 A D 로 차선을 옮기고, ↑ 또는 스페이스로 점프합니다.<br />
          작은 빨간 바이러스는 점프로 넘기고, 큰 보라 바이러스는 차선을 바꿔 피하세요.<br />
          백신은 목숨 +1 (최대 5), 데이터 칩은 +10점.
        </div>
        <button type="button" class="primary" id="startBtn">출발</button>
      </section>
      <section id="over" class="overlay" hidden>
        <p class="kicker">SYSTEM HALTED</p>
        <h2>게임 오버</h2>
        <p class="sub">바이러스가 연결을 끊었습니다.</p>
        <div class="results">
          <p><span>점수</span><b id="overScore">0</b></p>
          <p><span>거리</span><b id="overDist">0 m</b></p>
          <p><span>최고 점수</span><b id="overBest">0</b></p>
        </div>
        <button type="button" class="primary" id="retryBtn">다시 달리기</button>
        <button type="button" class="ghost" id="reselectBtn">캐릭터 바꾸기</button>
      </section>
    </div>
    <div id="pad">
      <button type="button" id="btnL" disabled>◀ 왼쪽</button>
      <button type="button" id="btnJ" disabled>점프</button>
      <button type="button" id="btnR" disabled>오른쪽 ▶</button>
    </div>
  </div>
<script>
const BEST_KEY = "cyber-runner-best";
const MAX_LIVES = 5;
const INVULN = 1.5;
const BASE_SPEED = 0.32;
const MAX_SPEED = 0.7;
const HIT_Z = 0.9;
const JUMP_V = 980;
const GRAVITY = 2800;
const JUMP_CLEAR = 105;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const menu = document.getElementById("menu");
const over = document.getElementById("over");
const heartsEl = document.getElementById("hearts");
const scoreEl = document.getElementById("score");
const distEl = document.getElementById("dist");

function makePoses(id, body) {
  const img = (name) => Object.assign(new Image(), { src: `assets/${id}/${name}.png` });
  return {
    idle: img("idle-front"),
    run: [1, 2, 3, 4, 5].map((n) => img("run-" + n)),
    cheer: img("cheer-back"),
    hurt: img("hurt-back"),
    body,
  };
}
const poses = {
  ttor: makePoses("ttor", { cheer: 0.86, hurt: 0.88 }),
  ppiya: makePoses("ppiya", { cheer: 0.78, hurt: 0.82 }),
};

let W = 360, H = 640;
let mode = "menu";
let character = "ttor";
let lives = MAX_LIVES;
let score = 0;
let distance = 0;
let speed = BASE_SPEED;
let lane = 1;
let visualLane = 1;
let jumpY = 0;
let jumpV = 0;
let squash = 1;
let invuln = 0;
let action = "run";
let actionT = 0;
let runClock = 0;
let shake = 0;
let flash = 0;
let spawnIn = 1;
let entities = [];
let popups = [];
let particles = [];
let last = performance.now();
let audioCtx = null;

const rain = Array.from({ length: 48 }, () => ({
  x: Math.random(),
  y: Math.random(),
  v: 0.12 + Math.random() * 0.4,
  ch: Math.random() < 0.5 ? "0" : "1",
  a: 0.18 + Math.random() * 0.45,
  size: 12 + Math.random() * 8,
}));

function bestScore() {
  return Number(localStorage.getItem(BEST_KEY) || 0);
}
function fmt(n) {
  return Math.floor(n).toLocaleString("ko-KR");
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const rect = canvas.getBoundingClientRect();
  W = Math.max(1, rect.width);
  H = Math.max(1, rect.height);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function xAt(unit, z) {
  const p = Math.pow(clamp(z, 0, 1), 1.18);
  const half = lerp(W * 0.055, Math.min(W * 0.4, 188), p);
  return W / 2 + (unit / 1.5) * half;
}
function yAt(z) {
  const p = Math.pow(clamp(z, 0, 1), 1.12);
  return lerp(H * 0.36, H * 0.84, p);
}
function scaleAt(z) {
  return lerp(0.16, 1, Math.pow(clamp(z, 0, 1), 1.35));
}

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, gain) {
  const ac = ensureAudio();
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, ac.currentTime);
  g.gain.setValueAtTime(gain, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g);
  g.connect(ac.destination);
  o.start();
  o.stop(ac.currentTime + dur);
}
function sfx(kind) {
  try {
    if (kind === "jump") tone(520, 0.12, "square", 0.04);
    else if (kind === "get") {
      tone(660, 0.08, "sine", 0.06);
      setTimeout(() => tone(880, 0.1, "sine", 0.05), 70);
    } else if (kind === "hit") tone(140, 0.22, "sawtooth", 0.05);
    else if (kind === "over") {
      tone(320, 0.18, "triangle", 0.06);
      setTimeout(() => tone(180, 0.28, "triangle", 0.05), 140);
    }
  } catch (err) { /* 소리 없이도 플레이 가능 */ }
}

function setPads(on) {
  document.querySelectorAll("#pad button").forEach((b) => { b.disabled = !on; });
}
function showMenu() {
  mode = "menu";
  entities = [];
  popups = [];
  particles = [];
  lane = 1;
  visualLane = 1;
  jumpY = 0;
  jumpV = 0;
  action = "run";
  actionT = 0;
  runClock = 0;
  menu.hidden = false;
  over.hidden = true;
  hud.hidden = true;
  setPads(false);
  document.getElementById("menuBest").textContent = "최고 점수 " + fmt(bestScore());
}
function showGame() {
  menu.hidden = true;
  over.hidden = true;
  hud.hidden = false;
  setPads(true);
}
function showOver() {
  mode = "over";
  const best = Math.max(bestScore(), Math.floor(score));
  localStorage.setItem(BEST_KEY, String(best));
  document.getElementById("overScore").textContent = fmt(score);
  document.getElementById("overDist").textContent = fmt(distance) + " m";
  document.getElementById("overBest").textContent = fmt(best);
  over.hidden = false;
  setPads(false);
  updateHud();
  sfx("over");
}

function resetRun() {
  lives = MAX_LIVES;
  score = 0;
  distance = 0;
  speed = BASE_SPEED;
  lane = 1;
  visualLane = 1;
  jumpY = 0;
  jumpV = 0;
  squash = 1;
  action = "run";
  actionT = 0;
  runClock = 0;
  invuln = 0;
  shake = 0;
  flash = 0;
  spawnIn = 0.9;
  entities = [];
  popups = [];
  particles = [];
  mode = "run";
  showGame();
  updateHud();
}

function updateHud() {
  heartsEl.innerHTML = Array.from({ length: MAX_LIVES }, (_, i) =>
    `<span class="${i < lives ? "on" : "off"}">♥</span>`
  ).join("");
  scoreEl.textContent = fmt(score);
  distEl.textContent = fmt(distance) + " m";
}

function moveLane(dir) {
  if (mode !== "run") return;
  lane = clamp(lane + dir, 0, 2);
}
function jump() {
  if (mode !== "run" || jumpY > 2) return;
  jumpV = JUMP_V;
  sfx("jump");
}
function popup(text, color) {
  popups.push({
    text,
    color,
    x: xAt(visualLane - 1, 1),
    y: yAt(1) - 150,
    life: 0.85,
  });
}
function burst(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x, y,
      vx: rand(-70, 70),
      vy: rand(-140, -30),
      life: rand(0.3, 0.55),
      color,
    });
  }
}
function playAction(name, dur) {
  if (action === "hurt" && name !== "hurt" && actionT > 0) return;
  action = name;
  actionT = dur;
}
function hurt() {
  lives -= 1;
  invuln = INVULN;
  playAction("hurt", 0.7);
  shake = 0.32;
  flash = 0.28;
  popup("-1", "#ff5d7a");
  sfx("hit");
  updateHud();
  if (lives <= 0) showOver();
}
function pickType() {
  const vaccine = lives >= MAX_LIVES ? 4 : 16;
  const table = distance < 50
    ? [["small", 55], ["chip", 34], ["vaccine", vaccine]]
    : [["small", 40], ["big", 20], ["chip", 26], ["vaccine", vaccine]];
  const total = table.reduce((s, row) => s + row[1], 0);
  let r = Math.random() * total;
  for (const [type, w] of table) {
    r -= w;
    if (r <= 0) return type;
  }
  return "small";
}
function spawnWave() {
  const lanes = [0, 1, 2];
  const first = lanes.splice(Math.floor(Math.random() * lanes.length), 1)[0];
  const wave = [{ type: pickType(), lane: first }];
  if (Math.random() < 0.35) {
    const second = lanes.splice(Math.floor(Math.random() * lanes.length), 1)[0];
    wave.push({ type: pickType(), lane: second });
  }
  const virusLanes = wave.filter((o) => o.type === "small" || o.type === "big").map((o) => o.lane);
  if (virusLanes.length >= 3) wave[0].type = "chip";
  for (const item of wave) {
    entities.push({ ...item, z: 0.04, resolved: false });
  }
}

function update(dt) {
  for (const drop of rain) {
    drop.y += drop.v * dt;
    if (drop.y > 1.05) {
      drop.y = -0.05;
      drop.x = Math.random();
    }
  }
  if (mode === "menu") {
    distance += dt * 8;
    visualLane += (1 - visualLane) * Math.min(1, dt * 4);
    return;
  }
  if (mode !== "run") return;

  distance += speed * dt * 22;
  score += speed * dt * 18;
  speed = Math.min(MAX_SPEED, BASE_SPEED + distance * 0.001);
  visualLane += (lane - visualLane) * Math.min(1, dt * 12);
  runClock += dt * (8 + speed * 5);
  if (actionT > 0) {
    actionT -= dt;
    if (actionT <= 0) action = "run";
  }

  const wasAir = jumpY > 0;
  jumpY += jumpV * dt;
  jumpV -= GRAVITY * dt;
  if (jumpY <= 0) {
    if (wasAir) squash = 0.78;
    jumpY = 0;
    jumpV = 0;
  }
  squash += (1 - squash) * Math.min(1, dt * 8);
  invuln = Math.max(0, invuln - dt);
  shake = Math.max(0, shake - dt);
  flash = Math.max(0, flash - dt);

  spawnIn -= dt;
  if (spawnIn <= 0) {
    spawnWave();
    spawnIn = Math.max(0.8, 1.28 - distance * 0.00075);
  }

  for (const obj of entities) {
    obj.z += speed * dt;
    if (!obj.resolved && obj.z >= HIT_Z) {
      obj.resolved = true;
      if (obj.lane === lane) resolveHit(obj);
    }
  }
  entities = entities.filter((obj) => obj.z < 1.18);

  for (const p of popups) {
    p.y -= 36 * dt;
    p.life -= dt;
  }
  popups = popups.filter((p) => p.life > 0);
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 280 * dt;
    p.life -= dt;
  }
  particles = particles.filter((p) => p.life > 0);
  updateHud();
}

function resolveHit(obj) {
  if (mode !== "run") return;
  const x = xAt(obj.lane - 1, HIT_Z);
  const y = yAt(HIT_Z);
  if (obj.type === "small") {
    if (jumpY >= JUMP_CLEAR || invuln > 0) return;
    hurt();
  } else if (obj.type === "big") {
    if (invuln > 0) return;
    hurt();
  } else if (obj.type === "chip") {
    score += 10;
    popup("+10", "#7ee0ff");
    burst(x, y, "#5ce1ff");
    playAction("cheer", 0.55);
    sfx("get");
  } else if (obj.type === "vaccine") {
    if (lives < MAX_LIVES) {
      lives += 1;
      popup("+1", "#6dff9a");
    } else {
      score += 50;
      popup("+50", "#6dff9a");
    }
    burst(x, y, "#3dff8a");
    playAction("cheer", 0.55);
    sfx("get");
    updateHud();
  }
}

function drawRoad() {
  ctx.beginPath();
  ctx.moveTo(xAt(-1.5, 0), yAt(0));
  ctx.lineTo(xAt(1.5, 0), yAt(0));
  ctx.lineTo(xAt(1.5, 1), yAt(1));
  ctx.lineTo(xAt(-1.5, 1), yAt(1));
  ctx.closePath();
  const road = ctx.createLinearGradient(0, yAt(0), 0, yAt(1));
  road.addColorStop(0, "#12305a");
  road.addColorStop(1, "#071226");
  ctx.fillStyle = road;
  ctx.fill();

  for (let i = 0; i < 3; i++) {
    const left = -1.5 + i;
    const right = left + 1;
    ctx.beginPath();
    ctx.moveTo(xAt(left, 0.15), yAt(0.15));
    ctx.lineTo(xAt(right, 0.15), yAt(0.15));
    ctx.lineTo(xAt(right, 1), yAt(1));
    ctx.lineTo(xAt(left, 1), yAt(1));
    ctx.closePath();
    const active = mode !== "menu" && Math.round(visualLane) === i;
    ctx.fillStyle = active ? "rgba(92, 225, 255, 0.09)" : "rgba(255,255,255,0.015)";
    ctx.fill();
  }

  ctx.strokeStyle = "rgba(120, 220, 255, 0.28)";
  ctx.lineWidth = 1.5;
  for (const edge of [-1.5, -0.5, 0.5, 1.5]) {
    ctx.beginPath();
    ctx.moveTo(xAt(edge, 0), yAt(0));
    ctx.lineTo(xAt(edge, 1), yAt(1));
    ctx.stroke();
  }
  const scroll = (distance * 0.012) % 0.09;
  ctx.strokeStyle = "rgba(140, 230, 255, 0.22)";
  for (let z = scroll; z < 1; z += 0.09) {
    ctx.beginPath();
    ctx.moveTo(xAt(-1.5, z), yAt(z));
    ctx.lineTo(xAt(1.5, z), yAt(z));
    ctx.stroke();
  }
}

function drawVirus(x, y, s, big) {
  const r = (big ? 54 : 27) * s;
  ctx.save();
  ctx.translate(x, y - r * 0.15);
  ctx.fillStyle = big ? "#6d35f0" : "#ff2f57";
  ctx.beginPath();
  const spikes = big ? 16 : 11;
  for (let i = 0; i < spikes; i++) {
    const a = (i / spikes) * Math.PI * 2 - Math.PI / 2;
    const rad = r * (i % 2 ? 0.58 : 1);
    const px = Math.cos(a) * rad;
    const py = Math.sin(a) * rad * 0.92;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = big ? "#b794ff" : "#ffd0da";
  ctx.beginPath();
  ctx.arc(-r * 0.28, -r * 0.05, r * 0.13, 0, Math.PI * 2);
  ctx.arc(r * 0.28, -r * 0.05, r * 0.13, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#1a1028";
  ctx.beginPath();
  ctx.arc(-r * 0.28, -r * 0.02, r * 0.06, 0, Math.PI * 2);
  ctx.arc(r * 0.28, -r * 0.02, r * 0.06, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#1a1028";
  ctx.lineWidth = Math.max(1, r * 0.08);
  ctx.beginPath();
  ctx.arc(0, r * 0.22, r * 0.22, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  ctx.restore();
}

function drawVaccine(x, y, s) {
  const w = 34 * s;
  const h = 16 * s;
  ctx.save();
  ctx.translate(x, y - 18 * s);
  ctx.fillStyle = "#1d8a4e";
  roundRect(-w, -h, w * 2, h * 2, h);
  ctx.fill();
  ctx.fillStyle = "#b8ffd4";
  ctx.fillRect(-w * 0.15, -h * 0.7, w * 0.3, h * 1.4);
  ctx.fillRect(-w * 0.45, -h * 0.28, w * 0.9, h * 0.56);
  ctx.restore();
}

function drawChip(x, y, s) {
  const r = 20 * s;
  ctx.save();
  ctx.translate(x, y - 16 * s);
  ctx.fillStyle = "#1aa2ff";
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#e9f8ff";
  ctx.font = `700 ${Math.max(8, 11 * s)}px ui-monospace, monospace`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("01", 0, 1);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawEntity(obj) {
  const s = scaleAt(obj.z);
  const x = xAt(obj.lane - 1, obj.z);
  const y = yAt(obj.z);
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath();
  ctx.ellipse(x, y, 18 * s, 6 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  if (obj.type === "small") drawVirus(x, y, s, false);
  else if (obj.type === "big") drawVirus(x, y, s, true);
  else if (obj.type === "vaccine") drawVaccine(x, y, s);
  else drawChip(x, y, s);
}

function playerSprite() {
  const pack = poses[character];
  if (action === "hurt") return { img: pack.hurt, body: pack.body.hurt };
  if (action === "cheer") return { img: pack.cheer, body: pack.body.cheer };
  const frame = jumpY > 24 ? 2 : Math.floor(runClock) % pack.run.length;
  return { img: pack.run[frame], body: 1 };
}
function drawPlayer() {
  const { img, body } = playerSprite();
  const bob = jumpY > 0 ? 0 : Math.sin((runClock / 2.5) * Math.PI) * 3;
  const x = xAt(visualLane - 1, 1);
  const foot = yAt(1) - jumpY * 0.72 + bob;
  const fit = clamp(H / 740, 0.7, 1.05);
  const aspect = img.complete && img.naturalWidth ? img.naturalWidth / img.naturalHeight : 0.55;
  const tall = (168 * fit * squash) / body;
  const wide = tall * aspect * (squash < 0.98 ? 1.12 : 1);
  ctx.fillStyle = `rgba(0,0,0,${0.28 * (1 - Math.min(1, jumpY / 180))})`;
  ctx.beginPath();
  ctx.ellipse(x, yAt(1) + 6, lerp(46, 22, Math.min(1, jumpY / 180)), 12, 0, 0, Math.PI * 2);
  ctx.fill();
  if (invuln > 0 && Math.floor(performance.now() / 80) % 2 === 0) return;
  const lean = (lane - visualLane) * 0.28;
  ctx.save();
  ctx.translate(x, foot);
  ctx.rotate(lean);
  if (img.complete && img.naturalWidth) {
    ctx.drawImage(img, -wide / 2, -tall, wide, tall);
  } else {
    ctx.fillStyle = character === "ppiya" ? "#ffd84a" : "#f4f7fb";
    ctx.beginPath();
    ctx.arc(0, -50, 36, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function draw() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#07111f");
  sky.addColorStop(0.42, "#12325e");
  sky.addColorStop(1, "#050a14");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(W / 2, yAt(0), 10, W / 2, yAt(0), W * 0.55);
  glow.addColorStop(0, "rgba(80, 210, 255, 0.45)");
  glow.addColorStop(1, "rgba(80, 210, 255, 0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  ctx.font = "14px ui-monospace, monospace";
  ctx.textAlign = "center";
  for (const drop of rain) {
    ctx.fillStyle = `rgba(110, 230, 255, ${drop.a})`;
    ctx.font = `${drop.size}px ui-monospace, monospace`;
    ctx.fillText(drop.ch, drop.x * W, drop.y * H * 0.7);
  }

  ctx.save();
  if (shake > 0) {
    const mag = shake * 28;
    ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
  }
  drawRoad();
  const ordered = [...entities].sort((a, b) => a.z - b.z);
  for (const obj of ordered) if (obj.z < 0.94) drawEntity(obj);
  drawPlayer();
  for (const obj of ordered) if (obj.z >= 0.94) drawEntity(obj);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.font = "800 22px sans-serif";
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (mode === "run" && distance < 30) {
    ctx.fillStyle = "rgba(232, 244, 255, 0.8)";
    ctx.font = "13px sans-serif";
    ctx.fillText("빨간 바이러스 점프  ·  보라 바이러스 차선 변경", W / 2, H - 18);
  }
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255, 40, 70, ${flash * 1.3})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

document.querySelectorAll(".card").forEach((card) => {
  card.addEventListener("click", () => {
    character = card.dataset.id;
    document.querySelectorAll(".card").forEach((el) => el.classList.toggle("selected", el === card));
  });
});
document.getElementById("startBtn").addEventListener("click", () => {
  ensureAudio();
  resetRun();
});
document.getElementById("retryBtn").addEventListener("click", () => {
  ensureAudio();
  resetRun();
});
document.getElementById("reselectBtn").addEventListener("click", showMenu);
document.getElementById("btnL").addEventListener("pointerdown", (e) => { e.preventDefault(); moveLane(-1); });
document.getElementById("btnJ").addEventListener("pointerdown", (e) => { e.preventDefault(); jump(); });
document.getElementById("btnR").addEventListener("pointerdown", (e) => { e.preventDefault(); moveLane(1); });

let swipeX = 0;
let swipeY = 0;
canvas.addEventListener("pointerdown", (e) => {
  swipeX = e.clientX;
  swipeY = e.clientY;
});
canvas.addEventListener("pointerup", (e) => {
  if (mode !== "run") return;
  const dx = e.clientX - swipeX;
  const dy = e.clientY - swipeY;
  if (Math.hypot(dx, dy) < 28) return;
  if (Math.abs(dy) > Math.abs(dx) && dy < 0) jump();
  else if (dx < -12) moveLane(-1);
  else if (dx > 12) moveLane(1);
});

window.addEventListener("keydown", (e) => {
  const key = e.key.toLowerCase();
  if (["arrowleft", "arrowright", "arrowup", " "].includes(key) || key === "a" || key === "d") {
    e.preventDefault();
  }
  if (e.repeat) return;
  if (mode === "menu" && (key === "enter" || key === " ")) {
    ensureAudio();
    resetRun();
    return;
  }
  if (key === "arrowleft" || key === "a") moveLane(-1);
  else if (key === "arrowright" || key === "d") moveLane(1);
  else if (key === "arrowup" || key === " ") jump();
});

document.getElementById("app").addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("resize", resize);
resize();
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
